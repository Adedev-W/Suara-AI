services:
  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy

  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suaraai}
      POSTGRES_USER: ${POSTGRES_USER:-suaraai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suaraai}
    volumes:
      - suaraai-postgres:/var/lib/postgresql/data
      - ./apps/backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suaraai} -d ${POSTGRES_DB:-suaraai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    environment:
      SUARAAI_API_PREFIX: ${SUARAAI_API_PREFIX:-/api/v1}
      SUARAAI_APP_NAME: ${SUARAAI_APP_NAME:-SuaraAI API}
      SUARAAI_DATABASE_URL: ${SUARAAI_DATABASE_URL:-postgresql+asyncpg://suaraai:suaraai@database:5432/suaraai}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SUARAAI_DEEPSEEK_BASE_URL: ${SUARAAI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SUARAAI_DEEPSEEK_MODEL: ${SUARAAI_DEEPSEEK_MODEL:-deepseek-flash}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          urllib.request.urlopen('http://localhost:8000' +
          os.environ['SUARAAI_API_PREFIX'] + '/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  suaraai-postgres:
  caddy-data:
  caddy-config:
