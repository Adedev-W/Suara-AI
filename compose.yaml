services:
  backend:
    build:
      context: ./apps/backend
    environment:
      SUARAAI_API_PREFIX: ${SUARAAI_API_PREFIX:-/api/v1}
      SUARAAI_APP_NAME: ${SUARAAI_APP_NAME:-SuaraAI API}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:?ASSEMBLYAI_API_KEY is required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?TAVILY_API_KEY is required}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          urllib.request.urlopen('http://localhost:8000' +
          os.environ['SUARAAI_API_PREFIX'] + '/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
