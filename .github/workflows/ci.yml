name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.1"
      - name: Install backend dependencies
        run: |
          if [ -f apps/backend/uv.lock ]; then
            uv sync --project apps/backend --locked
          else
            uv sync --project apps/backend
          fi
      - name: Lint backend
        run: make lint-backend
      - name: Check backend formatting
        run: cd apps/backend && uv run ruff format --check .
      - name: Type-check backend
        run: make typecheck-backend
      - name: Test backend
        run: make test-backend
      - name: Build backend package
        run: make build-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install frontend dependencies
        run: |
          if [ -f apps/frontend/package-lock.json ]; then
            npm --prefix apps/frontend ci
          else
            npm --prefix apps/frontend install
          fi
      - name: Lint frontend
        run: make lint-frontend
      - name: Check frontend formatting
        run: npm --prefix apps/frontend run format:check
      - name: Type-check frontend
        run: make typecheck-frontend
      - name: Test frontend
        run: make test-frontend
      - name: Build frontend
        run: make build-frontend

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Build production images
        run: docker compose build
