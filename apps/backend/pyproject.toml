[project]
name = "suaraai-backend"
version = "0.1.0"
description = "SuaraAI FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "assemblyai>=1.1.0",
    "fastapi>=0.141.1,<0.142",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tavily-python>=0.8.0",
    "uvicorn[standard]>=0.52.4,<0.53",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "mypy>=2.3.1,<2.4",
    "pytest>=9.1.1,<9.2",
    "ruff>=0.16.5,<0.17",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suaraai"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.12.1,<0.13"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
